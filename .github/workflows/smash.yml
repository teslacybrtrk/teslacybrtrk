name: Cybertruck Smash

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  smash:
    if: startsWith(github.event.issue.title, 'cybertruck|smash')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Throw the ball
        id: throw
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_FILE: ${{ runner.temp }}/comment.md
          COMMIT_MSG_FILE: ${{ runner.temp }}/commit.txt
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Several throws can land at once: rebuild on the latest state and retry on push conflicts.
          for attempt in 1 2 3 4 5 6; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            rm -f "$COMMIT_MSG_FILE"
            python3 game/smash.py play
            if [ ! -f "$COMMIT_MSG_FILE" ]; then
              exit 0
            fi
            git add README.md game/state.json game/cybertruck.svg
            git commit -F "$COMMIT_MSG_FILE"
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            sleep $((attempt * 2 + RANDOM % 3))
          done
          echo "Could not push after several attempts" >&2
          exit 1

      - name: Reply and close
        if: always() && steps.throw.outputs.valid != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          VALID: ${{ steps.throw.outputs.valid }}
          OUTCOME: ${{ steps.throw.outcome }}
        run: |
          if [ "$OUTCOME" != "success" ]; then
            echo "😵 The ball got stuck: too many throws at once. Please try again in a minute!" > "$RUNNER_TEMP/comment.md"
            VALID=false
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          if [ "$VALID" = "true" ]; then
            gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
          else
            gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason "not planned"
          fi
